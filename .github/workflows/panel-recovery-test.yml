name: Atomic panel recovery regression
on:
  push:
    paths:
      - 'scripts/split_panels.py'
      - 'tests/test_split_panels.py'
      - '.github/workflows/panel-recovery-test.yml'
  pull_request:
    paths:
      - 'scripts/split_panels.py'
      - 'tests/test_split_panels.py'
      - '.github/workflows/panel-recovery-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s tests -p 'test_split_panels.py'
