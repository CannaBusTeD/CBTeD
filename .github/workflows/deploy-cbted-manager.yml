name: Publish CBTeD Project Manager

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "supabase/functions/cbted-mcp/**"
      - "tests/**"
      - ".github/workflows/deploy-cbted-manager.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cbted-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Validate app source
        run: |
          node --check app/app.js
          node --check app/production.js
          node --check app/oauth/consent/consent.js
          node --check --input-type=module < supabase/functions/cbted-mcp/index.ts
          node tests/check-cbted-mcp.mjs
          node --check app/config.js
          node --check app/auth-notices.mjs
          node --check app/writing-fields.mjs
          node --check app/studio-workspace.mjs
          node tests/check-project-manager.mjs
          node tests/check-auth-notices.mjs
          node tests/check-writing-fields.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the static CBTeD app
        uses: actions/upload-pages-artifact@v4
        with:
          path: app
      - name: Deploy the project manager
        id: deployment
        uses: actions/deploy-pages@v4
