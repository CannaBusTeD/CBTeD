name: Check Supabase secret names (temporary)
# Temporary and read-only. Reports only whether a secret named RUNWAY_API_KEY is saved in Supabase.
# It never prints any secret's value or digest, and it changes nothing.
on:
  push:
    branches: ["check/runway-secret"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    environment: cbted-production
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Report whether RUNWAY_API_KEY is saved (names only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: dmzzyfiwtosxtyekpbfi
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN is not available to this check."; exit 1; fi
          raw=$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" -o json 2>/dev/null) || raw=""
          names=$(printf '%s' "$raw" | jq -r '.[].name' 2>/dev/null) || names=""
          if [ -z "$names" ]; then
            # Older CLI output is a NAME | DIGEST table: keep only the NAME column.
            names=$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" 2>/dev/null | awk -F'|' 'NF>=2 {gsub(/[[:space:]]/,"",$1); if ($1!="" && $1!="NAME" && $1 !~ /^-+$/) print $1}') || names=""
          fi
          if [ -z "$names" ]; then echo "::error::Could not read secret names from Supabase."; exit 1; fi
          echo "Supabase returned $(printf '%s\n' "$names" | grep -c .) secret names."
          if printf '%s\n' "$names" | grep -qx 'RUNWAY_API_KEY'; then
            echo "RESULT: RUNWAY_API_KEY is saved."
          else
            echo "RESULT: RUNWAY_API_KEY is NOT saved."
            similar=$(printf '%s\n' "$names" | grep -i 'runway' || true)
            if [ -n "$similar" ]; then echo "Similar names found: $(printf '%s' "$similar" | tr '\n' ' ')"; fi
          fi
