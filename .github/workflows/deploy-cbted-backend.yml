name: Deploy CBTeD Supabase Backend

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "tests/check-cbted-mcp.mjs"
      - "tests/check-production.mjs"
      - ".github/workflows/deploy-cbted-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cbted-supabase-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate MCP bridge syntax and protocol tests
        run: |
          node --check --input-type=module < supabase/functions/cbted-mcp/index.ts
          node tests/check-cbted-mcp.mjs
          node --check supabase/functions/_shared/production.mjs
          node --check --input-type=module < supabase/functions/cbted-orchestrator/index.ts
          node --test tests/check-production.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: cbted-production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy CBTeD MCP and orchestrator from GitHub
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: dmzzyfiwtosxtyekpbfi
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          supabase functions deploy cbted-orchestrator --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy cbted-mcp --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
