name: Test CBTeD Orchestration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax of orchestration modules and backend entrypoints
        run: |
          node --check app/production.js
          node --check supabase/functions/_shared/production.mjs
          node --check --input-type=module < supabase/functions/cbted-orchestrator/index.ts
          node --check --input-type=module < supabase/functions/cbted-mcp/index.ts
          node --check --input-type=module < supabase/functions/cbted-external-review/index.ts
      - name: Verify deterministic gates and existing MCP auth
        run: |
          node --test tests/check-production.mjs
          node --test tests/check-task-router.mjs
          node --check app/socials.js
          node --test tests/check-social-connect.mjs
          node --test tests/check-social-oauth.mjs
          node --test tests/check-media-credit-policy.mjs
          node --test tests/check-generation-routing.mjs
          node --test tests/check-pipeline-branches.mjs
          node --test tests/check-media-gate.mjs
          node --check --input-type=module < supabase/functions/cbted-media-gate/index.ts
          node --check supabase/functions/_shared/social-providers.mjs
          node --check --input-type=module < supabase/functions/cbted-social-connect/index.ts
          node tests/check-cbted-mcp.mjs
          node --test tests/check-oauth-callbacks.mjs
      - name: Render and verify a real local MP4 with music in FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version
          python3 tests/test_assembly.py
      - name: Verify live orchestrator and refusal of unauthorised requests
        run: node tests/check-orchestrator-live.mjs
      - name: Verify external review rejects unauthenticated access
        run: node tests/check-external-review-live.mjs
      - name: Verify the published production interface is available
        run: node tests/check-production-site.mjs
